# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
sourceDir: E:/图书馆/ROSA
configuration:
  pageTitle: "ROSA★绒花计划Wiki"
  pageTitleSuffix: " | 绒花计划Wiki"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: zh-CN
  baseUrl: quartz.jzhao.xyz
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .git
    - .trash
    - "**/.DS_Store"
    - "**/desktop.ini"
    - "**/Thumbs.db"
    - .workspace.json
    - "**/.workspace.json"
    - .obsidian/workspace.json
    - "**/.obsidian/workspace.json"
    - .obsidian/plugins/**/*.js
    - .obsidian/plugins/**/*.json
    - "**/.trash/**"
    - "**/.git"
    - "**/.gitignore"
    - .agent_context
    - AGENTS.md
    - "**/AGENTS.md"
    - AGENTS.agent-context-indexer.md
    - "**/AGENTS.agent-context-indexer.md"
    - main.js
    - manifest.json
    - styles.css
    - "**/styles.css"
    - Obsidian_AI_Sandbox
    - 指令集
    - 00 主面板
    - 99 模板
    - 98 附件
    - 97 旧资料存档
    - 96 事务管理
    - 07 资料收藏
    - 08 外部资源导航
    - 05 同人作品
    - 03 设定/99 杂项
  theme:
    fontOrigin: local
    typography:
      header: '"Segoe UI", "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif'
      body: '"Segoe UI", "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif'
      code: '"Cascadia Code", "JetBrains Mono", "Fira Code", "Source Code Pro", "Noto Sans Mono CJK SC", Consolas, "Courier New", monospace'
    colors:
      lightMode:
        light: "#fafafa"
        lightgray: "#e8e8e8"
        gray: "#d0d0d0"
        darkgray: "#3a3a3a"
        dark: "#1a1a1a"
        secondary: "#1a4480"
        tertiary: "#5a7ba8"
        highlight: "rgba(26, 68, 128, 0.08)"
        textHighlight: "rgba(255, 213, 79, 0.4)"
      darkMode:
        light: "#1a1a1c"
        lightgray: "#2a2a2e"
        gray: "#3a3a3e"
        darkgray: "#d4d4d8"
        dark: "#f0f0f0"
        secondary: "#6ba0d8"
        tertiary: "#8ab4d8"
        highlight: "rgba(107, 160, 216, 0.12)"
        textHighlight: "rgba(255, 213, 79, 0.25)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      fontOrigin: local
      useThemeFonts: false
      body: '"Segoe UI", "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif'
      header: '"Segoe UI", "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif'
      code: '"Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace'
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
    options:  # 导航栏标题自定义
      title: "导航"
      folderClickBehavior: link
      folderDefaultState: collapsed
      useSavedState: true
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: false
    options:
      links:
        "CC BY-NC-SA 4.0": "https://creativecommons.org/licenses/by-nc-sa/4.0/"
        "免责声明": "/02-帮助/免责声明"
        "联系我们": "/02-帮助/联系我们"
        "关于本站": "/02-帮助/关于"
        "常见问答": "/02-帮助/常见问答"
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
